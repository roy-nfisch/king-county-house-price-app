name: Publish API image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish, e.g. 2026.10.28 or 2026.10.28.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ghcr-publishing
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      image: ${{ steps.release.outputs.image }}
      version: ${{ steps.release.outputs.version }}
      image_id: ${{ steps.archive.outputs.image_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate manual release request
        id: release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo '::error::Publish only from main.'
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[1-9][0-9]*)?$ || ${#VERSION} -gt 128 ]]; then
            echo '::error::Use YYYY.MM.DD or YYYY.MM.DD.N, such as 2026.10.28.1.'
            exit 1
          fi
          python3 -c 'import datetime, os; datetime.date(*map(int, os.environ["VERSION"].split(".")[:3]))'
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.5"
      - name: Install locked test dependencies
        run: |
          uv python install
          uv sync --locked
      - name: Check Python code and package
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv build
      - name: Validate Compose and build image
        env:
          IMAGE: ${{ steps.release.outputs.image }}
        run: |
          docker compose config --quiet
          docker build -t "$IMAGE:test" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
      - name: Run all tests against the built image
        env:
          DOCKER_TEST_IMAGE: ${{ steps.release.outputs.image }}:test
        run: uv run --locked pytest tests/
      - name: Save the tested image
        id: archive
        env:
          IMAGE: ${{ steps.release.outputs.image }}
        run: |
          echo "image_id=$(docker image inspect --format '{{.Id}}' "$IMAGE:test")" >> "$GITHUB_OUTPUT"
          docker save --output "$RUNNER_TEMP/image.tar" "$IMAGE:test"
      - name: Transfer tested image to publishing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.verify.outputs.image }}
      VERSION: ${{ needs.verify.outputs.version }}
      TESTED_IMAGE_ID: ${{ needs.verify.outputs.image_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-image
          path: ${{ runner.temp }}
      - name: Load and confirm the tested image
        run: |
          docker load --input "$RUNNER_TEMP/image.tar"
          [[ "$(docker image inspect --format '{{.Id}}' "$IMAGE:test")" == "$TESTED_IMAGE_ID" ]]
          docker tag "$IMAGE:test" "$IMAGE:$VERSION"
          docker tag "$IMAGE:test" "$IMAGE:sha-$GITHUB_SHA"
      - name: Sign in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Reject an existing version tag
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/check_image_version.py
      - name: Publish version and commit tags
        run: |
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:sha-$GITHUB_SHA"
      - name: Pull the published digest
        id: published
        run: |
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION")
          [[ "$reference" == "$IMAGE@sha256:"* ]]
          docker pull "$reference"
          [[ "$(docker image inspect --format '{{.Id}}' "$reference")" == "$TESTED_IMAGE_ID" ]]
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          printf 'Published and pulled: `%s`\n' "$reference" >> "$GITHUB_STEP_SUMMARY"
      - name: Check published image with the approved model
        shell: bash
        env:
          REFERENCE: ${{ steps.published.outputs.reference }}
        run: |
          model_path=$(docker run --rm --entrypoint python "$REFERENCE" -c \
            'from king_county.artifacts import DEFAULT_MODEL_PATH; print(DEFAULT_MODEL_PATH)')
          test -f "$GITHUB_WORKSPACE/$model_path"
          docker run --detach --name published-api --publish 127.0.0.1::8000 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/$model_path,target=/models/pipeline.skops,readonly" \
            "$REFERENCE"
          for attempt in {1..30}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' published-api)
            if [[ "$status" == healthy ]]; then break; fi
            if [[ "$status" == unhealthy ]]; then docker logs published-api; exit 1; fi
            sleep 2
          done
          if [[ "$status" != healthy ]]; then docker logs published-api; exit 1; fi
          port=$(docker port published-api 8000/tcp)
          curl --connect-timeout 5 --max-time 15 --fail --silent --show-error "http://$port/health"
          curl --connect-timeout 5 --max-time 15 --fail --silent --show-error "http://$port/predict" \
            -H 'Content-Type: application/json' --data-binary @examples/house.json | \
            python3 -c 'import json, math, sys; p=json.load(sys.stdin)["predicted_price"]; assert math.isfinite(p) and p > 0'
      - name: Update latest after verification
        env:
          REFERENCE: ${{ steps.published.outputs.reference }}
        run: |
          docker tag "$REFERENCE" "$IMAGE:latest"
          docker push "$IMAGE:latest"
          printf 'Verified tags: `%s`, `sha-%s`, `latest`\n' "$VERSION" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove verification container
        if: always()
        run: |
          if docker container inspect published-api > /dev/null 2>&1; then
            docker rm --force published-api
          fi
      - name: Sign out of GHCR
        if: always()
        run: docker logout ghcr.io
