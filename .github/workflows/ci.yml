name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep each test worker from starting its own pool of numerical-library threads.
env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  BLIS_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  checks:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.5"
      - name: Install project Python
        run: uv python install
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Build package
        run: uv build

  tests:
    name: ${{ matrix.category }} tests
    needs: checks
    runs-on: ubuntu-slim
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - category: unit
            workers: 0
          - category: integration
            workers: 2
          - category: contract
            workers: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.5"
      - name: Install project Python and test dependencies
        run: |
          uv python install
          uv sync --locked --extra ui
      - name: Run selected test category
        run: uv run --locked --extra ui pytest tests/ -m "${{ matrix.category }} and not docker" -n ${{ matrix.workers }} --dist loadfile

  docker:
    needs: checks
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.5"
      - name: Install project Python and test dependencies
        run: |
          uv python install
          uv sync --locked
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build runtime image
        run: docker build -t king-county-api:test .
      - name: Run container smoke tests
        env:
          DOCKER_TEST_IMAGE: king-county-api:test
        run: uv run --locked pytest tests/ -m "integration and docker"
