[project]
name = "mle-refactoring-project"
version = "0.1.0"
description = "Reusable King County preprocessing and house-price prediction."
readme = "README.md"
requires-python = ">=3.13.17"
dependencies = [
    "fastapi>=0.115,<1",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "pydantic>=2,<3",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "skops>=0.14.0",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.16,<3",
    "ipykernel>=7.3.0",
    "nbformat>=5.11.1",
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["king_county", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py313"
line-length = 88
include = ["src/**/*.py", "tests/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.uv]
required-version = ">=0.13.5"
# Apply certificate fixes without adding unused runtime packages.
constraint-dependencies = ["certifi>=2026.10.19", "pip>=26.2.2"]
